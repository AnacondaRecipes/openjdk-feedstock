anaconda_config_version: 1
upstream_sources:
  - github:
      identifier: JetBrains/JetBrainsRuntime
      use_max_tag: true
      include_regex: ^jbr-release-25\.\d+\.\d+b\d+\.\d+$
      from_pattern: ^jbr-release-(\d+\.\d+\.\d+)b\d+\.\d+$
      to_pattern: \1
  - github:
      identifier: JetBrains/JetBrainsRuntime
      use_max_tag: true
      prefix: openssl-
      include_regex: ^jbr-release-21\.\d+\.\d+b\d+\.\d+$
      from_pattern: ^jbr-release-(\d+\.\d+\.\d+)b\d+\.\d+$
      to_pattern: \1
    feedstock_branch: 'main-21'
    version_matchspec: '>=21,<22'
    supported: true
# both openjdk 21 and 25 are long term support releases